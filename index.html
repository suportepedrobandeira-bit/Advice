<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Advice · Pipeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh}
button,input,select,textarea{font-family:inherit}
.nav{background:#111827;display:flex;position:sticky;top:0;z-index:30}
.nav-tab{flex:1;padding:0;border:none;background:transparent;color:#9ca3af;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;border-bottom:3px solid transparent;transition:all .2s}
.nav-tab.active{color:#fff;border-bottom-color:#1a6cf6}
.page{display:none}.page.active{display:block}
.board{display:flex;gap:14px;padding:16px;align-items:flex-start;overflow-x:auto;min-height:calc(100vh - 52px)}
.col{flex:0 0 280px;background:#e4e8ef;border-radius:14px;padding:12px}
.col-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:2px 4px}
.col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.col-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#374151;flex:1}
.col-count{font-size:11px;font-weight:700;background:#fff;border-radius:99px;padding:2px 9px;color:#6b7280}
.card{background:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:3px solid transparent;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.11)}
.card-name{font-size:13px;font-weight:600;color:#111827;margin-bottom:3px}
.card-cnpj{font-size:10px;color:#9ca3af;font-family:monospace;margin-bottom:7px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.card-foot{display:flex;align-items:center;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid #f3f4f6}
.avatar{width:18px;height:18px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#6b7280;flex-shrink:0}
.add-btn{width:100%;padding:9px;font-size:12px;color:#9ca3af;background:rgba(255,255,255,.6);border:1.5px dashed #cbd5e1;border-radius:10px;cursor:pointer;font-weight:500;margin-top:4px}
.add-btn:hover{border-color:#1a6cf6;color:#1a6cf6;background:#fff}
.empty{text-align:center;padding:24px 8px;color:#cbd5e1;font-size:12px}
.ctrl-page{padding:16px;padding-bottom:80px;max-width:900px;margin:0 auto}
.ctrl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.ctrl-title{font-family:Georgia,serif;font-size:18px;font-weight:600;color:#111827}
.period-sel{display:flex;gap:8px;align-items:center}
.period-sel select{padding:7px 12px;border:1px solid #e5e7eb;border-radius:9px;font-size:13px;background:#fff;color:#111827;outline:none;-webkit-appearance:none;cursor:pointer}
.resumo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:600px){.resumo-grid{grid-template-columns:repeat(5,1fr)}}
.resumo-card{background:#fff;border-radius:12px;padding:14px 16px;border-left:4px solid}
.resumo-label{font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.resumo-val{font-size:20px;font-weight:700}
.resumo-sub{font-size:11px;color:#9ca3af;margin-top:2px}
.ranking-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.rank-card{background:#fff;border-radius:12px;padding:14px;text-align:center;border-top:3px solid}
.rank-pos{font-size:22px;margin-bottom:4px}
.rank-nome{font-size:13px;font-weight:700;color:#111827;margin-bottom:6px}
.section-title{font-size:12px;font-weight:700;color:#6b7280;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.table-wrap{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:16px;border:1px solid #e5e7eb}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:.07em;text-transform:uppercase;padding:10px 14px;text-align:left;background:#f9fafb;border-bottom:1px solid #e5e7eb}
td{font-size:13px;color:#374151;padding:10px 14px;border-bottom:1px solid #f3f4f6}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9fafb}
.td-nome{font-weight:600;color:#111827}
.td-val-pos{font-weight:700;color:#16a34a}
.td-val-neg{font-weight:700;color:#dc2626}
.tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.fab-ctrl{position:fixed;bottom:24px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:19}
.fab-btn{width:48px;height:48px;border-radius:99px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-head{padding:14px 18px 12px;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.sheet-title{font-family:Georgia,serif;font-size:17px;font-weight:600;color:#111827}
.close-btn{width:32px;height:32px;border:none;background:#f3f4f6;border-radius:8px;font-size:18px;color:#6b7280;cursor:pointer}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;font-size:14px;border:1px solid #e5e7eb;border-radius:9px;background:#fff;color:#111827;outline:none;-webkit-appearance:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:#1a6cf6}
.field textarea{resize:vertical;min-height:68px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-foot{padding:12px 18px calc(60px + env(safe-area-inset-bottom));border-top:1px solid #f3f4f6;display:flex;flex-direction:column;gap:9px}
.foot-row{display:flex;gap:8px}
.btn{padding:11px 14px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#374151;flex:1}
.btn-primary{background:#111827;color:#fff;border-color:#111827}
.btn-blue{background:#1a6cf6;color:#fff;border-color:#1a6cf6;flex:2}
.btn-green{background:#16a34a;color:#fff;border-color:#16a34a}
.btn-danger{border-color:#fca5a5;color:#dc2626;flex:.7}
.status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block}
.chk-row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:9px;margin-bottom:7px;cursor:pointer;border:1px solid #e5e7eb;background:#fff;-webkit-user-select:none;user-select:none}
.chk-box{width:19px;height:19px;border-radius:5px;border:2px solid #d1d5db;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-sep{border-top:1px solid #f3f4f6;padding-top:14px;margin-bottom:13px}
.section-lbl{font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;font-size:12px;font-weight:600;padding:10px 20px;border-radius:99px;z-index:999;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:700px){.overlay{align-items:center;padding:16px}.sheet{border-radius:16px;max-width:560px;max-height:92vh}}
</style>
</head>

<script>
const SUPA_URL='https://uezenhprvilatvzidjkr.supabase.co/rest/v1';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlemVuaHBydmlsYXR2emlkamtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4Nzk5MTAsImV4cCI6MjA5MjQ1NTkxMH0.v23laxRdOaKVf8bQS4MIiDtTFxmg21RgI05qNdKR3GE';
const HDR={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
async function api(path,opts={}){const r=await fetch(SUPA_URL+path,{headers:HDR,...opts});if(!r.ok)throw new Error(await r.text());if(r.status===204)return null;return r.json();}

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtDate(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function hsh(d){return JSON.stringify(d);}
function parseBRL(s){if(!s)return 0;return parseFloat(String(s).replace(/[R$\s.]/g,'').replace(',','.'))||0;}
function fmtBRL(v){return'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function addDays(ds,n){if(!ds)return null;const d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function diasRestantes(ds,n){if(!ds)return null;const a=new Date(ds);a.setDate(a.getDate()+n);const h=new Date();h.setHours(0,0,0,0);return Math.ceil((a-h)/(864e5));}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}

// Máscara BRL
function maskBRL(el){
  let v=el.value.replace(/\D/g,'');
  if(!v){el.value='';return;}
  const n=(parseInt(v)/100).toFixed(2);
  el.value='R$ '+parseFloat(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function bindBRL(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.removeEventListener('input',el._brl);
  el._brl=()=>maskBRL(el);
  el.addEventListener('input',el._brl);
}

function switchPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('tab-'+p).classList.add('active');
  if(p==='ctrl')renderCtrl();
}

const COLS=[
  {id:'prospeccao',label:'Prospecções',color:'#f59e0b'},
  {id:'entrada',label:'Entrada',color:'#1a6cf6'},
  {id:'onboarding',label:'Onboarding',color:'#d97706'},
  {id:'concluido',label:'Concluído',color:'#16a34a'},
  {id:'rel30',label:'Relacionamento 30d',color:'#8b5cf6'},
  {id:'atend30',label:'Atendido 30d',color:'#0891b2'},
  {id:'rel60',label:'Relacionamento 60d',color:'#ec4899'},
  {id:'atend60',label:'Atendido 60d',color:'#059669'},
];
const ST={
  prospeccao:{bg:'#fef3c7',color:'#92400e',label:'Prospecção'},
  entrada:{bg:'#dbeafe',color:'#1d4ed8',label:'Entrada'},
  onboarding:{bg:'#fef3c7',color:'#92400e',label:'Onboarding'},
  concluido:{bg:'#dcfce7',color:'#15803d',label:'Concluído'},
  rel30:{bg:'#ede9fe',color:'#6d28d9',label:'Relacionamento 30d'},
  atend30:{bg:'#cffafe',color:'#0e7490',label:'Atendido 30d'},
  rel60:{bg:'#fce7f3',color:'#be185d',label:'Relacionamento 60d'},
  atend60:{bg:'#d1fae5',color:'#065f46',label:'Atendido 60d'},
};
const REGIME={simples:'Simples',presumido:'Presumido',real:'Lucro Real'};
const NEXT={prospeccao:'entrada',entrada:'onboarding',onboarding:'concluido',concluido:'rel30',rel30:'atend30',atend30:'rel60',rel60:'atend60',atend60:null};
const PREV={prospeccao:null,entrada:'prospeccao',onboarding:'entrada',concluido:'onboarding',rel30:'concluido',atend30:'rel30',rel60:'atend30',atend60:'rel60'};

let clients=[],kbHash='',kbSaving=false,newTarget='prospeccao';
const chk={folha:false,contabil:false};

function rowTo(r){return{id:r.id,nome:r.nome,cnpj:r.cnpj,segmento:r.segmento,responsavel:r.responsavel,socio:r.socio,telefone:r.telefone,email:r.email,honorarios:r.honorarios,dataEntrada:r.data_entrada,dataOnboarding:r.data_onboarding,dataConcluido:r.data_concluido,obs:r.obs,status:r.status,regime:r.regime,folha:r.folha,contabil:r.contabil};}
async function loadKb(){const d=await api('/clientes?order=criado_em.asc');return d.map(rowTo);}

async function initKb(){
  try{
    clients=await loadKb();kbHash=hsh(clients);
    document.getElementById('loading-kb').style.display='none';
    document.getElementById('board').style.display='flex';
    renderKb();
    setInterval(async()=>{if(kbSaving)return;try{const f=await loadKb();const h=hsh(f);if(h!==kbHash){clients=f;kbHash=h;renderKb();showToast('✦ Atualizado');}}catch{}},4000);
  }catch(e){document.getElementById('loading-kb').innerHTML=`<div style="text-align:center"><div style="font-size:32px;margin-bottom:10px">⚠️</div><div style="color:#dc2626;font-weight:600">Erro ao conectar</div><div style="color:#9ca3af;font-size:12px;margin-top:6px">${e.message}</div></div>`;}
}

function rankingHTML(cards,col){
  const socios=['Pedro','Luciano','Rafael'];
  const dados=socios.map(s=>({nome:s,qtd:cards.filter(c=>c.socio===s).length,val:cards.filter(c=>c.socio===s).reduce((a,c)=>a+parseBRL(c.honorarios),0)})).filter(s=>s.qtd>0).sort((a,b)=>b.val-a.val);
  if(dados.length===0)return'';
  const medalhas=['🥇','🥈','🥉'];
  return`<div style="background:${col.color}12;border:1px solid ${col.color}33;border-radius:9px;padding:8px 10px;margin-bottom:10px">
    <div style="font-size:10px;font-weight:700;color:${col.color};text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">🏆 Ranking</div>
    ${dados.map((s,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${i<dados.length-1?4:0}px"><span style="font-size:11px;font-weight:600;color:#374151">${medalhas[i]||''} ${s.nome}</span><div><span style="font-size:11px;font-weight:700;color:${col.color}">${fmtBRL(s.val)}</span><span style="font-size:10px;color:#9ca3af;margin-left:4px">(${s.qtd})</span></div></div>`).join('')}
  </div>`;
}

function renderKb(){
  const board=document.getElementById('board');board.innerHTML='';
  COLS.forEach(col=>{
    const cards=clients.filter(c=>c.status===col.id);
    const el=document.createElement('div');el.className='col';
    let extra='';
    if(col.id==='prospeccao'){
      const total=cards.reduce((a,c)=>a+parseBRL(c.honorarios),0);
      extra=`<div style="background:${col.color}22;border:1px solid ${col.color}44;border-radius:9px;padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:10px;font-weight:700;color:${col.color};text-transform:uppercase;letter-spacing:.06em">Total potencial</span><span style="font-size:14px;font-weight:700;color:${col.color}">${fmtBRL(total)}</span></div>`;
    }
    extra+=rankingHTML(cards,col);
    el.innerHTML=`<div class="col-hdr"><div class="col-dot" style="background:${col.color}"></div><span class="col-title">${col.label}</span><span class="col-count">${cards.length}</span></div>${extra}${cards.length===0?'<div class="empty">Nenhum cliente</div>':''}${cards.map(c=>cardHTML(c,col)).join('')}<button class="add-btn" data-col="${col.id}">+ Novo cliente</button>`;
    board.appendChild(el);
  });
  board.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openEdit(el.dataset.id)));
  board.querySelectorAll('.add-btn').forEach(el=>el.addEventListener('click',()=>openNew(el.dataset.col)));
}

function cardHTML(c,col){
  let prazo='';
  if((c.status==='rel30'||c.status==='rel60')&&c.dataConcluido){
    const days=c.status==='rel30'?30:60;const dv=addDays(c.dataConcluido,days);const dr=diasRestantes(c.dataConcluido,days);
    const cor=dr<0?'#dc2626':dr<=7?'#d97706':'#16a34a';const txt=dr<0?`⚠️ Vencido há ${Math.abs(dr)}d`:dr===0?'⚠️ Vence hoje':`✅ ${dr}d restantes`;
    prazo=`<div style="margin-top:8px;padding:7px 10px;border-radius:8px;background:${cor}12;border:1px solid ${cor}33"><div style="font-size:10px;font-weight:700;color:${cor};text-transform:uppercase;margin-bottom:1px">📅 Vencimento</div><div style="font-size:13px;font-weight:700;color:${cor}">${fmtDate(dv)}</div><div style="font-size:10px;color:${cor};opacity:.85">${txt}</div></div>`;
  }
  if(c.status==='prospeccao'){
    return`<div class="card" data-id="${c.id}" style="border-left-color:${col.color}">
      <div class="card-name">${esc(c.nome)}</div>
      ${c.honorarios?`<div style="font-size:14px;font-weight:700;color:#f59e0b;margin:4px 0">${esc(c.honorarios)}</div>`:''}
      <div class="card-foot"><div class="avatar" style="background:#fef3c7;color:#92400e">${(c.socio||'?')[0].toUpperCase()}</div><span style="font-size:11px;color:#6b7280;font-weight:600">${esc(c.socio||'Sem sócio')}</span></div>
    </div>`;
  }
  const socioNome=c.socio||c.responsavel||'';
  return`<div class="card" data-id="${c.id}" style="border-left-color:${col.color}">
    <div class="card-name">${esc(c.nome)}</div>
    ${c.cnpj?`<div class="card-cnpj">${esc(c.cnpj)}</div>`:''}
    <div class="badges">
      ${c.segmento?`<span class="badge" style="background:${col.color}18;color:${col.color}">${esc(c.segmento)}</span>`:''}
      ${c.regime?`<span class="badge" style="background:#f3f4f6;color:#6b7280">${REGIME[c.regime]||c.regime}</span>`:''}
      ${c.folha?`<span class="badge" style="background:#eff6ff;color:#1d4ed8">Folha</span>`:''}
      ${c.contabil?`<span class="badge" style="background:#f0fdf4;color:#15803d">Contábil</span>`:''}
      ${c.honorarios?`<span class="badge" style="background:#f0fdf4;color:#16a34a">${esc(c.honorarios)}</span>`:''}
      ${c.status==='onboarding'&&c.dataOnboarding?`<span class="badge" style="background:#fef3c7;color:#92400e">📅 ${fmtDate(c.dataOnboarding)}</span>`:''}
    </div>
    ${prazo}
    <div class="card-foot">
      <div class="avatar" style="background:${col.color}22;color:${col.color}">${socioNome?socioNome[0].toUpperCase():'?'}</div>
      <span style="font-size:10px;color:#6b7280;font-weight:600">${esc(socioNome||'Sem sócio')}</span>
    </div>
  </div>`;
}

    <div style="padding:16px 18px">

async function kbSalvar(id){
  kbSaving=true;
  try{
    await api(`/clientes?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({nome:document.getElementById('e-nome').value,cnpj:document.getElementById('e-cnpj').value,segmento:document.getElementById('e-seg').value,honorarios:document.getElementById('e-hon').value,responsavel:document.getElementById('e-resp').value,socio:document.getElementById('e-socio').value,telefone:document.getElementById('e-tel').value,email:document.getElementById('e-email').value,data_entrada:document.getElementById('e-dentrada').value,data_onboarding:document.getElementById('e-donboard').value,obs:document.getElementById('e-obs').value,regime:document.getElementById('e-regime').value,folha:chk.folha,contabil:chk.contabil})});
    clients=await loadKb();kbHash=hsh(clients);closeEdit();renderKb();showToast('✦ Salvo');
  }catch(e){alert('Erro: '+e.message);}
  kbSaving=false;

async function kbMover(id,status){
  kbSaving=true;const hoje=new Date().toISOString().slice(0,10);const payload={status};
  if(status==='concluido')payload.data_concluido=hoje;
  try{
    await api(`/clientes?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(payload)});
    if(status==='concluido'){const orig=clients.find(c=>c.id===id);if(orig){
      await api('/clientes',{method:'POST',body:JSON.stringify({id:uid(),nome:orig.nome,cnpj:orig.cnpj,segmento:orig.segmento,responsavel:orig.responsavel,socio:orig.socio,telefone:orig.telefone,email:orig.email,honorarios:orig.honorarios,regime:orig.regime,folha:orig.folha,contabil:orig.contabil,data_entrada:orig.dataEntrada,data_onboarding:orig.dataOnboarding,data_concluido:hoje,obs:'🔔 Relacionamento 30 dias',status:'rel30'})});
      await api('/clientes',{method:'POST',body:JSON.stringify({id:uid(),nome:orig.nome,cnpj:orig.cnpj,segmento:orig.segmento,responsavel:orig.responsavel,socio:orig.socio,telefone:orig.telefone,email:orig.email,honorarios:orig.honorarios,regime:orig.regime,folha:orig.folha,contabil:orig.contabil,data_entrada:orig.dataEntrada,data_onboarding:orig.dataOnboarding,data_concluido:hoje,obs:'🔔 Relacionamento 60 dias',status:'rel60'})});
    }}
    clients=await loadKb();kbHash=hsh(clients);closeEdit();renderKb();
    if(status==='concluido')showToast('✦ Concluído! Cards 30d e 60d criados');else showToast('✦ Movido para '+ST[status].label);
  }catch(e){alert('Erro: '+e.message);}
  kbSaving=false;
}

async function kbDeletar(id){
  if(!confirm('Remover este cliente?'))return;kbSaving=true;
  try{await api(`/clientes?id=eq.${id}`,{method:'DELETE'});clients=await loadKb();kbHash=hsh(clients);closeEdit();renderKb();showToast('✦ Removido');}catch(e){alert('Erro: '+e.message);}
  kbSaving=false;
}

    <div class="section-title">🏆 Ranking ${MESES[mes]} · ${ano}</div>
    <div class="ranking-grid" style="margin-bottom:20px">${rankMes.map((s,i)=>`<div class="rank-card" style="border-top-color:${rankColors[i]}"><div class="rank-pos">${medalhas[i]}</div><div class="rank-nome">${s.nome}</div><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">${s.entradas} ent · ${s.saidas} saí</div><div style="display:flex;flex-direction:column;gap:2px;font-size:12px"><span style="color:#16a34a;font-weight:600">▲ ${fmtBRL(s.valorEnt)}</span><span style="color:#dc2626;font-weight:600">▼ ${fmtBRL(s.valorSai)}</span><div style="border-top:1px solid #f3f4f6;margin-top:4px;padding-top:4px;font-size:13px;font-weight:700;color:${s.saldo>=0?'#16a34a':'#dc2626'}">= ${fmtBRL(s.saldo)}</div></div></div>`).join('')}</div>
    <div class="section-title">🏆 Ranking Anual · ${ano}</div>
    <div class="ranking-grid" style="margin-bottom:20px">${rankAnual.map((s,i)=>`<div class="rank-card" style="border-top-color:${rankColors[i]}"><div class="rank-pos">${medalhas[i]}</div><div class="rank-nome">${s.nome}</div><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">${s.entradas} ent · ${s.saidas} saí</div><div style="display:flex;flex-direction:column;gap:2px;font-size:12px"><span style="color:#16a34a;font-weight:600">▲ ${fmtBRL(s.valorEnt)}</span><span style="color:#dc2626;font-weight:600">▼ ${fmtBRL(s.valorSai)}</span><div style="border-top:1px solid #f3f4f6;margin-top:4px;padding-top:4px;font-size:13px;font-weight:700;color:${s.saldo>=0?'#16a34a':'#dc2626'}">= ${fmtBRL(s.saldo)}</div></div></div>`).join('')}</div>
    <div class="section-title"><span>✅ Entradas — ${MESES[mes]}/${ano}</span><span style="color:#16a34a">${fmtBRL(totEntMes)}</span></div>
    <div class="table-wrap">${entMes.length===0?`<div style="text-align:center;padding:24px;color:#d1d5db;font-size:12px">Nenhuma entrada neste mês</div>`:`<table><thead><tr><th>Cliente</th><th>Honorários</th><th>Sócio</th><th>Segmento</th></tr></thead><tbody>${entMes.map(m=>`<tr onclick="openMovDet('${m.id}')" style="cursor:pointer"><td class="td-nome">${esc(m.nome)}</td><td class="td-val-pos">${fmtBRL(parseBRL(m.honorarios))}</td><td><span class="tag" style="background:#eff6ff;color:#1d4ed8">${esc(m.socio)}</span></td><td><span class="tag" style="background:#f3f4f6;color:#6b7280">${esc(m.segmento||'—')}</span></td></tr>`).join('')}</tbody></table>`}</div>
    <div class="section-title"><span>❌ Saídas — ${MESES[mes]}/${ano}</span><span style="color:#dc2626">${fmtBRL(totSaiMes)}</span></div>
    <div class="table-wrap" style="margin-bottom:80px">${saiMes.length===0?`<div style="text-align:center;padding:24px;color:#d1d5db;font-size:12px">Nenhuma saída neste mês</div>`:`<table><thead><tr><th>Cliente</th><th>Honorários</th><th>Sócio</th><th>Motivo</th></tr></thead><tbody>${saiMes.map(m=>`<tr onclick="openMovDet('${m.id}')" style="cursor:pointer"><td class="td-nome">${esc(m.nome)}</td><td class="td-val-neg">${fmtBRL(parseBRL(m.honorarios))}</td><td><span class="tag" style="background:#eff6ff;color:#1d4ed8">${esc(m.socio)}</span></td><td style="font-size:12px;color:#9ca3af">${esc(m.obs||'—')}</td></tr>`).join('')}</tbody></table>`}</div>`;
}

function openMovimento(tipo){
  movTipo=tipo;
  document.getElementById('mov-title').textContent=tipo==='entrada'?'➕ Nova Entrada':'➖ Registrar Saída';
  document.getElementById('mov-save-btn').className='btn '+(tipo==='entrada'?'btn-green':'btn-danger');
  ['m-nome','m-hon','m-anual','m-obs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('m-socio').value='';document.getElementById('m-seg').value='';
  document.getElementById('mov-overlay').classList.add('open');
  setTimeout(()=>{
    bindBRL('m-hon');
    const mhon=document.getElementById('m-hon');
    if(mhon)mhon.addEventListener('input',()=>{const v=parseBRL(mhon.value);document.getElementById('m-anual').value=v?fmtBRL(v*12):'';});
  },100);
}
function closeMov(){document.getElementById('mov-overlay').classList.remove('open');}

async function saveMov(){
  const nome=document.getElementById('m-nome').value.trim();const hon=document.getElementById('m-hon').value.trim();const socio=document.getElementById('m-socio').value;
  if(!nome||!hon||!socio){alert('Preencha cliente, honorários e sócio.');return;}
  const mov={id:uid(),tipo:movTipo,nome,honorarios:hon,socio,segmento:document.getElementById('m-seg').value,obs:document.getElementById('m-obs').value,mes:parseInt(document.getElementById('m-mes').value),ano:parseInt(document.getElementById('m-ano').value),data:new Date().toISOString().slice(0,10)};
  try{await saveMovEntry(mov);closeMov();await renderCtrl();showToast(movTipo==='entrada'?'✦ Entrada registrada':'✦ Saída registrada');}catch(e){alert('Erro ao salvar: '+e.message);}
}

async function openMovDet(id){
  let movs=[];try{movs=await loadMovs();}catch{}
  const m=movs.find(x=>x.id===id);if(!m)return;
  const isEnt=m.tipo==='entrada';
  document.getElementById('movdet-sheet').innerHTML=`<div class="sheet-head"><div><div class="sheet-title">${esc(m.nome)}</div><span class="status-pill" style="background:${isEnt?'#dcfce7':'#fee2e2'};color:${isEnt?'#15803d':'#dc2626'}">${isEnt?'Entrada':'Saída'}</span></div><button class="close-btn" onclick="closeMovDet()">×</button></div><div style="padding:16px 18px"><div class="grid2"><div class="field"><label>Honorários</label><input readonly value="${esc(m.honorarios)}" style="background:#f9fafb"/></div><div class="field"><label>Valor anual</label><input readonly value="${fmtBRL(parseBRL(m.honorarios)*12)}" style="background:#f9fafb"/></div><div class="field"><label>Sócio</label><input readonly value="${esc(m.socio)}" style="background:#f9fafb"/></div><div class="field"><label>Segmento</label><input readonly value="${esc(m.segmento||'—')}" style="background:#f9fafb"/></div><div class="field"><label>Período</label><input readonly value="${MESES[m.mes]}/${m.ano}" style="background:#f9fafb"/></div><div class="field"><label>Data registro</label><input readonly value="${fmtDate(m.data)}" style="background:#f9fafb"/></div>${m.obs?`<div class="field" style="grid-column:1/-1"><label>Observação</label><input readonly value="${esc(m.obs)}" style="background:#f9fafb"/></div>`:''}</div></div><div class="sheet-foot"><div class="foot-row"><button class="btn btn-danger" onclick="deleteMov('${m.id}')">Excluir</button><button class="btn btn-primary" onclick="closeMovDet()">Fechar</button></div></div>`;
  document.getElementById('movdet-overlay').classList.add('open');
}
function closeMovDet(){document.getElementById('movdet-overlay').classList.remove('open');}
async function deleteMov(id){
  if(!confirm('Excluir este registro?'))return;
  try{await deleteMovEntry(id);closeMovDet();await renderCtrl();showToast('✦ Registro excluído');}catch(e){alert('Erro: '+e.message);}
}

['edit-overlay','new-overlay','mov-overlay','movdet-overlay'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(el=>el.classList.remove('open'));});

initKb();
initCtrl();
</script>
</body>
</html>
